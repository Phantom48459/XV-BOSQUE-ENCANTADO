<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis XV Años</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

<section class="page hero active" id="portada">

    <div class="overlay">

        <p class="welcome">BIENVENIDOS AL BOSQUE ENCANTADO</p>

        <h1 class="name">Nombre</h1>

        <p class="subtitle">MIS XV AÑOS</p>

        <p class="date">Fecha del evento</p>

        <button type="button" onclick="mostrarPagina('invitado')">
            Entrar al bosque
        </button>

    </div>

</section>

<section class="page guest-section" id="invitado">

    <div class="guest-card">

        <p class="guest-introduction">
            Con mucha alegría invitamos a:
        </p>

        <div class="ornament">❦</div>

        <h2 class="guest-name" id="guestName">
            Invitado especial
        </h2>

        <div class="ornament">❦</div>

        <p class="invitation-text">
            A compartir con nosotros una noche llena de magia.
        </p>

        <div class="navigation-buttons">

            <button
                type="button"
                class="back-button"
                onclick="mostrarPagina('portada')"
            >
                Regresar
            </button>

            <button
                type="button"
                onclick="mostrarPagina('fecha')"
            >
                Continuar
            </button>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>

</html>
